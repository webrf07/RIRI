<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Gift For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0b2e, #2d1b4e, #4a1942);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 105, 180, 0.4);
            animation: floatUp 8s linear infinite;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem;
            color: #ff9ec6;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 158, 198, 0.5);
        }

        .subtitle {
            color: #e0b0ff;
            font-size: 1.1rem;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .gift-box {
            width: 220px;
            height: 180px;
            margin: 0 auto 30px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .gift-box:hover {
            transform: scale(1.05);
        }

        .gift-box.shake {
            animation: shake 0.5s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .box-body {
            width: 100%;
            height: 130px;
            background: linear-gradient(145deg, #ff6b9d, #c44569);
            border-radius: 10px;
            position: absolute;
            bottom: 0;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .box-lid {
            width: 100%;
            height: 50px;
            background: linear-gradient(145deg, #ff8fab, #ff6b9d);
            border-radius: 10px 10px 5px 5px;
            position: absolute;
            top: 0;
            transform-origin: bottom;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .gift-box.open .box-lid {
            transform: rotateX(-110deg) translateY(-20px);
        }

        .ribbon-vertical {
            width: 30px;
            height: 100%;
            background: #fff;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .ribbon-horizontal {
            width: 100%;
            height: 30px;
            background: #fff;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
        }

        .bow {
            width: 60px;
            height: 40px;
            background: #fff;
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50% 50% 0 0;
            z-index: 3;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .bow::before, .bow::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: #fff;
            border-radius: 50%;
            top: 5px;
        }
        .bow::before { left: -20px; }
        .bow::after { right: -20px; }

        .message {
            display: none;
            margin-top: 30px;
            animation: fadeInUp 1s ease forwards;
        }

        .message.show {
            display: block;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: #ff9ec6;
            margin-bottom: 15px;
        }

        .message p {
            color: #f0d0ff;
            font-size: 1.2rem;
            max-width: 400px;
            margin: 0 auto 20px;
            line-height: 1.6;
        }

        .tap-hint {
            color: #c9a0dc;
            font-size: 0.95rem;
            margin-top: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b9d;
            top: -10px;
            z-index: 5;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .music-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.3s;
        }

        .music-btn:hover {
            background: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>

    <div id="hearts"></div>

    <div class="container">
        <h1>A Special Gift</h1>
        <p class="subtitle">Just for you 💕</p>

        <div class="gift-box" id="giftBox">
            <div class="box-lid">
                <div class="bow"></div>
            </div>
            <div class="ribbon-vertical"></div>
            <div class="ribbon-horizontal"></div>
            <div class="box-body"></div>
        </div>

        <p class="tap-hint" id="hint">Tap the gift to open it ✨</p>

        <div class="message" id="message">
            <h2>You're my, my, my, my Lover</h2>
            <p>
                Can I go where you go?<br>
                Can we always be this close?<br>
                Forever and ever...
            </p>
            <p style="font-size: 1.4rem; color: #ff9ec6;">❤️ Lover ❤️</p>
        </div>
    </div>

    <!-- ضع ملف الأغنية هنا -->
    <audio id="song" loop>
        <source src="lover.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <button class="music-btn" id="musicBtn" style="display:none;">
        🔊 Music On
    </button>

    <script>
        const giftBox = document.getElementById('giftBox');
        const message = document.getElementById('message');
        const hint = document.getElementById('hint');
        const song = document.getElementById('song');
        const musicBtn = document.getElementById('musicBtn');
        let isOpen = false;
        let isPlaying = false;

        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (6 + Math.random() * 6) + 's';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.fontSize = (16 + Math.random() * 20) + 'px';
                heartsContainer.appendChild(heart);
            }
        }
        createHearts();

        giftBox.classList.add('shake');
        setTimeout(() => giftBox.classList.remove('shake'), 3000);

        giftBox.addEventListener('click', () => {
            if (isOpen) return;
            isOpen = true;

            giftBox.classList.remove('shake');
            giftBox.classList.add('open');
            hint.style.display = 'none';

            song.play().then(() => {
                isPlaying = true;
                musicBtn.style.display = 'block';
            }).catch(() => {
                musicBtn.style.display = 'block';
            });

            setTimeout(() => {
                message.classList.add('show');
            }, 600);

            createConfetti();
        });

        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                song.pause();
                musicBtn.innerHTML = '🔇 Music Off';
                isPlaying = false;
            } else {
                song.play();
                musicBtn.innerHTML = '🔊 Music On';
                isPlaying = true;
            }
        });

        function createConfetti() {
            const colors = ['#ff6b9d', '#ff9ec6', '#c44569', '#ffd1dc', '#e0b0ff', '#ffffff'];
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (2 + Math.random() * 3) + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.width = (6 + Math.random() * 8) + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }
    </script>
</body>
</html>
