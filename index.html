<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RIRI & RAOUF</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="bgMusic" loop preload="auto"><source src="song.mp3.mp3" type="audio/mpeg"></audio>

<!-- SCREEN 1: PASSWORD -->
<div id="s1">
  <div class="hearts-top">
    <div class="h1"><span>RIRI</span></div>
    <div class="h2"><span>RAOUF</span></div>
  </div>
  <p class="title">Enter the secret code</p>
  <div class="dots" id="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div class="pad">
    <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button>
    <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
    <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button>
    <button data-n="del" class="del">⌫</button><button data-n="0">0</button><button data-n="ok" class="ok">✓</button>
  </div>
  <p class="sub">6 digits</p>
  <span class="dec" style="top:6%;left:8%">💖</span>
  <span class="dec" style="top:12%;right:10%">🧸</span>
  <span class="dec" style="bottom:18%;left:6%">🌸</span>
  <span class="dec" style="bottom:12%;right:8%">🌺</span>
  <span class="dec" style="top:40%;right:5%">💕</span>
  <span class="dec" style="top:55%;left:5%">🧸</span>
</div>

<!-- SCREEN 2: BOW & HEART -->
<div id="s2">
  <p class="s2-top">a little something, for you</p>

  <div id="heart" class="heart-wrap">
    <svg viewBox="0 0 100 90" width="130" height="117">
      <defs>
        <radialGradient id="hg" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#ffb3c6"/>
          <stop offset="55%" stop-color="#ff6b8a"/>
          <stop offset="100%" stop-color="#e84a6f"/>
        </radialGradient>
      </defs>
      <path d="M50 82 C18 55 3 32 18 16 C28 6 43 10 50 24 C57 10 72 6 82 16 C97 32 82 55 50 82Z"
            fill="url(#hg)" stroke="#e84a6f" stroke-width="1.2"/>
      <ellipse cx="34" cy="26" rx="11" ry="7" fill="rgba(255,255,255,0.35)"/>
    </svg>
  </div>

  <div id="bowArea" class="bow-area">
    <svg class="bow-svg" viewBox="0 0 110 90" width="110" height="90">
      <path d="M75 12 Q100 45 75 78" fill="none" stroke="#5d4037" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M75 12 Q50 45 75 78" fill="none" stroke="#5d4037" stroke-width="5.5" stroke-linecap="round"/>
      <rect x="67" y="38" width="16" height="14" rx="3" fill="#4e342e"/>
      <line id="string" x1="75" y1="12" x2="75" y2="78" stroke="#8d6e63" stroke-width="1.8"/>
    </svg>
    <div id="arrow" class="arrow">
      <svg viewBox="0 0 80 16" width="80" height="16">
        <line x1="8" y1="8" x2="62" y2="8" stroke="#6d4c41" stroke-width="2.8"/>
        <polygon points="62,2 80,8 62,14" fill="#e84a6f"/>
        <path d="M10 3 Q4 8 10 13" fill="none" stroke="#ff8fab" stroke-width="2.2"/>
        <path d="M16 2 Q9 8 16 14" fill="none" stroke="#ff6b8a" stroke-width="2"/>
      </svg>
    </div>
  </div>

  <p class="s2-bot" id="s2bot">TAP TO SHOOT</p>
  <p class="s2-names" id="s2names">RIRI & RAOUF</p>

  <div id="parts" class="parts"></div>
  <div id="fill" class="fill"></div>

  <div id="love" class="love">
    <div class="grid"></div>
    <p class="wish">make a wish...</p>
    <h1>I LOVE YOU<br>BBY</h1>
    <div class="uline"></div>
    <p class="to">to someone worth celebrating</p>
  </div>
</div>

<!-- SCREEN 3: TREE -->
<div id="s3">
  <div class="s3-text">
    <p class="s3-a">and... make it count</p>
    <h2 class="s3-b">YOU ARE MY LIFE</h2>
    <p class="s3-c">here's to a year that blooms</p>
  </div>
  <div class="tree-box">
    <div id="trunk" class="trunk"></div>
    <div id="branches" class="branches">
      <i style="--h:90px;left:50%;bottom:0;transform:translateX(-50%) rotate(-52deg);width:4px"></i>
      <i style="--h:75px;left:36%;bottom:35px;transform:rotate(-68deg);width:3.5px"></i>
      <i style="--h:65px;left:24%;bottom:65px;transform:rotate(-82deg);width:3px"></i>
      <i style="--h:50px;left:20%;bottom:90px;transform:rotate(-98deg);width:3px"></i>
      <i style="--h:42px;left:28%;bottom:110px;transform:rotate(-118deg);width:2.5px"></i>
      <i style="--h:90px;left:50%;bottom:0;transform:translateX(-50%) rotate(52deg);width:4px"></i>
      <i style="--h:75px;left:64%;bottom:35px;transform:rotate(68deg);width:3.5px"></i>
      <i style="--h:65px;left:76%;bottom:65px;transform:rotate(82deg);width:3px"></i>
      <i style="--h:50px;left:80%;bottom:90px;transform:rotate(98deg);width:3px"></i>
      <i style="--h:42px;left:72%;bottom:110px;transform:rotate(118deg);width:2.5px"></i>
      <i style="--h:48px;left:44%;bottom:135px;transform:rotate(-22deg);width:3px"></i>
      <i style="--h:48px;left:56%;bottom:135px;transform:rotate(22deg);width:3px"></i>
      <i style="--h:32px;left:49%;bottom:150px;transform:rotate(-4deg);width:2.5px"></i>
      <i style="--h:32px;left:51%;bottom:150px;transform:rotate(4deg);width:2.5px"></i>
    </div>
    <div id="baseH" class="base-h"><span>💗</span><span>💕</span><span>💖</span></div>
    <div id="blooms" class="blooms"></div>
  </div>
  <span class="tf" style="top:18%;left:58%">💗</span>
  <span class="tf" style="top:28%;left:72%">💕</span>
  <span class="tf" style="top:42%;left:80%">💖</span>
  <span class="tf" style="top:22%;left:42%">💘</span>
</div>

<script>
var music = document.getElementById('bgMusic');
music.volume = 0.7;
function tryPlay(){ music.play().catch(function(){}); }
window.addEventListener('load', tryPlay);
document.body.addEventListener('touchstart', tryPlay, {once:true});
document.body.addEventListener('click', tryPlay, {once:true});

var CODE = '071115';
var cur = '';
var dots = document.querySelectorAll('.dot');

function showDots(){
  for(var i=0;i<6;i++){
    if(i < cur.length){ dots[i].textContent='💗'; dots[i].classList.add('on'); }
    else { dots[i].textContent=''; dots[i].classList.remove('on'); }
  }
}

function check(){
  if(cur.length < 6) return;
  if(cur === CODE){ setTimeout(goS2, 350); }
  else {
    for(var i=0;i<6;i++) dots[i].classList.add('err');
    setTimeout(function(){
      for(var j=0;j<6;j++){ dots[j].classList.remove('err','on'); dots[j].textContent=''; }
      cur='';
    }, 450);
  }
}

document.querySelectorAll('.pad button').forEach(function(btn){
  btn.addEventListener('click', function(){
    var n = btn.getAttribute('data-n');
    if(n === 'del'){ cur = cur.slice(0,-1); showDots(); }
    else if(n === 'ok'){ check(); }
    else if(cur.length < 6){
      cur += n; showDots();
      if(cur.length === 6) setTimeout(check, 180);
    }
  });
});

function goS2(){
  document.getElementById('s1').style.display = 'none';
  document.getElementById('s2').classList.add('show');
  setTimeout(function(){
    document.getElementById('s2bot').style.opacity = '0';
    document.getElementById('s2names').classList.add('show');
  }, 700);
}

var fired = false;

function shoot(){
  if(fired) return;
  fired = true;

  var heart = document.getElementById('heart');
  var arrow = document.getElementById('arrow');
  var string = document.getElementById('string');
  var bowArea = document.getElementById('bowArea');

  arrow.style.transition = 'transform 0.2s ease-out';
  arrow.style.transform = 'translateX(-28px)';
  if(string) string.setAttribute('x2', '52');
  bowArea.style.transform = 'rotate(4deg)';

  setTimeout(function(){
    var hr = heart.getBoundingClientRect();
    var ar = arrow.getBoundingClientRect();
    var dx = (hr.left + hr.width/2) - (ar.left + ar.width/2);
    var dy = (hr.top + hr.height/2) - (ar.top + ar.height/2);

    arrow.style.transition = 'transform 0.65s cubic-bezier(0.2,0.7,0.3,1)';
    arrow.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    if(string) string.setAttribute('x2', '75');
    bowArea.style.transform = '';

    setTimeout(function(){
      heart.classList.add('boom');
      explode(hr.left + hr.width/2, hr.top + hr.height/2);
      arrow.style.opacity = '0';

      setTimeout(function(){
        document.getElementById('fill').classList.add('on');
        setTimeout(function(){
          document.getElementById('love').classList.add('on');
          setTimeout(goS3, 4000);
        }, 850);
      }, 400);
    }, 600);
  }, 200);
}

document.getElementById('bowArea').addEventListener('click', shoot);
document.getElementById('bowArea').addEventListener('touchend', function(e){ e.preventDefault(); shoot(); }, {passive:false});
document.getElementById('heart').addEventListener('click', shoot);
document.getElementById('heart').addEventListener('touchend', function(e){ e.preventDefault(); shoot(); }, {passive:false});

function explode(x, y){
  var box = document.getElementById('parts');
  var cols = ['#ff6b8a','#ff8fab','#ffb3c6','#e84a6f','#fff','#ffd1dc'];
  for(var i=0;i<30;i++){
    var p = document.createElement('div');
    p.className = 'p';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = cols[i % cols.length];
    var s = 7 + Math.random()*14;
    p.style.width = p.style.height = s + 'px';
    box.appendChild(p);
    (function(el, k){
      var a = (Math.PI*2*k)/30 + Math.random()*0.5;
      var d = 50 + Math.random()*150;
      var tx = Math.cos(a)*d;
      var ty = Math.sin(a)*d - 40;
      requestAnimationFrame(function(){
        el.style.transition = 'transform 0.85s cubic-bezier(0.1,0.6,0.3,1), opacity 0.85s';
        el.style.opacity = '1';
        el.style.transform = 'translate('+tx+'px,'+ty+'px) scale(0)';
      });
    })(p, i);
  }
}

function goS3(){
  document.getElementById('s2').style.display = 'none';
  document.getElementById('s3').classList.add('show');
  setTimeout(function(){
    document.getElementById('trunk').classList.add('up');
    document.getElementById('branches').classList.add('up');
    document.getElementById('baseH').classList.add('up');
    setTimeout(fillBlooms, 3000);
  }, 350);
}

function fillBlooms(){
  var box = document.getElementById('blooms');
  var list = [
    [15,40,18,'💗'],[8,70,16,'💕'],[5,100,15,'💖'],[12,125,14,'💗'],[25,145,15,'💓'],
    [205,40,18,'💗'],[212,70,16,'💕'],[215,100,15,'💖'],[208,125,14,'💗'],[195,145,15,'💓'],
    [40,20,17,'💖'],[60,8,16,'💗'],[85,5,18,'💕'],[55,35,14,'💓'],[75,25,15,'💗'],
    [135,5,18,'💕'],[160,8,16,'💗'],[180,20,17,'💖'],[145,25,15,'💗'],[165,35,14,'💓'],
    [110,15,16,'💗'],[100,40,15,'💕'],[120,40,15,'💖'],[90,70,14,'💗'],[130,70,14,'💓'],
    [100,100,16,'💕'],[120,100,15,'💖'],[110,130,17,'💗'],[110,155,18,'💖'],
    [30,55,13,'💗'],[45,85,14,'💕'],[35,110,13,'💖'],[190,55,13,'💗'],[175,85,14,'💕'],
    [185,110,13,'💖'],[70,55,14,'💓'],[150,55,14,'💗'],[80,90,13,'💕'],[140,90,13,'💖'],
    [95,120,14,'💗'],[125,120,14,'💓'],
    [50,50,15,'🧡'],[170,50,15,'💛'],[90,30,14,'🧡'],[130,30,14,'💛'],
    [110,80,15,'🧡'],[70,115,13,'💛'],[150,115,13,'🧡'],[110,50,16,'💛']
  ];
  list.forEach(function(item, i){
    var s = document.createElement('span');
    s.textContent = item[3];
    s.style.left = item[0] + 'px';
    s.style.top = item[1] + 'px';
    s.style.fontSize = item[2] + 'px';
    box.appendChild(s);
    setTimeout(function(){ s.classList.add('on'); }, 70 * i);
  });
}
</script>
</body>
</html>
